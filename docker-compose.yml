# Copy .env.example to .env, adjust it, then run: docker compose up -d
services:
  tmodloader:
    image: ghcr.io/ntn-gameserver/tmodloader-server-light:latest
    # build: .
    container_name: tmodloader
    restart: unless-stopped
    # Must exceed TMOD_SHUTDOWN_DELAY + TMOD_SHUTDOWN_TIMEOUT.
    stop_grace_period: 2m
    env_file: .env
    ports:
      - "${TMOD_HOST_PORT:-7777}:${TMOD_PORT:-7777}/tcp"
    volumes:
      - "./data:/data"
      # For TMOD_USECONFIGFILE=Yes:
      # - "./customconfig.txt:/terraria-server/customconfig.txt:ro"
      # For TMOD_PASS_FILE=/run/secrets/tmod-password:
      # - "./secrets/tmod-password:/run/secrets/tmod-password:ro"
