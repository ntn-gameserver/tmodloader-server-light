# Copy .env.example to .env, adjust it, then: docker compose up -d --build
services:
  tmodloader:
    build: .
    container_name: tmodloader
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    env_file: .env
    ports:
      - "${TMOD_PORT:-7777}:${TMOD_PORT:-7777}/tcp"
    volumes:
      - "./data:/data"
      # For TMOD_USECONFIGFILE=Yes:
      # - "./customconfig.txt:/terraria-server/customconfig.txt:ro"
